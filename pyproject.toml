[project]
name = "pheme-report"
version = "0.1.0"
description = "Consolidated execution report for the test runs under out/, with Bedrock commentary"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.6.0",
]

[project.scripts]
pheme-report = "pheme_report.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pheme_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
